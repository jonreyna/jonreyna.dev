name: jonreyna_dev
description: The jonreyna.dev website, a static Jaspr site. Versions are pinned exactly.
version: 0.0.1
publish_to: none

environment:
  # Jaspr 0.23.5 (stable) does not resolve on Dart 3.14 (analyzer conflict). Move to
  # Dart 3.14 with Jaspr 0.24 once it is stable.
  sdk: '>=3.13.0 <3.14.0'

dependencies:
  jaspr: 0.23.5
  jaspr_content: 0.5.4
  jaspr_router: 0.9.0
  universal_web: 1.1.1+2

dev_dependencies:
  build_runner: 2.15.1
  build_web_compilers: 4.8.5
  jaspr_builder: 0.23.5
  lints: ^5.0.0
  test: 1.31.1

jaspr:
  mode: static
