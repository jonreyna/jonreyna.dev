# Variants choose sections and highlights; they never reword. A highlight's score is its
# weight plus `boost_by` (default 20) for each boosted tag it carries.
variants:
  full:
    description: The two-page résumé, everything in this file.
    sections: [summary, skills, experience, earlier, education]
  onepage:
    description: One page for quick reads; the strongest highlights from Juniper on.
    sections: [summary, experience, skills, education]
    since: 2015-04
    max_highlights: 3
    min_weight: 70
  go:
    description: For Go roles.
    sections: [summary, skills, experience, education]
    boost: [go, distributed]
    max_highlights: 4
  ai-infra:
    description: For AI and ML infrastructure roles.
    sections: [summary, skills, experience, education]
    boost: [ai, hpc, distributed, networking]
    max_highlights: 4
    show_courses: [math]
