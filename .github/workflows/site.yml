# Builds and checks the site on every push and pull request, then:
#   - push to main  -> publishes to Cloudflare (production), once resume and site pass
#   - pull request  -> uploads a preview version and comments its URL on the PR
#   - weekly        -> a build only, so toolchain breakage shows up before you need to publish
#   - tag resume-v* -> attaches the résumé files to a GitHub release (the release job)
# Every run keeps the rendered résumé files as an artifact named resume-<commit>.
# Cloudflare steps are skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets exist. Third-party actions are pinned by commit SHA.
name: site

on:
  push:
    branches: [main]
    tags: ["resume-v*"]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Cancel superseded PR builds; never cancel a production deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The résumé pipeline: vitae's lint and tests, and strict validation of resume.yaml;
  # also actionlint on this workflow.
  # The site job renders the public variants for the résumé page. Neither job is ever
  # given the private overlay.
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/vitae/go.mod
          cache-dependency-path: tools/*/go.mod

      - name: Lint and test the Go tools, and validate the résumé
        run: make resume-check

      - name: Lint the workflows
        run: make workflow-lint

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Jaspr 0.23.5 needs Dart 3.13 (see site/pubspec.yaml).
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.13.7

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dart3.13.7-${{ hashFiles('site/pubspec.lock') }}

      # `make site` builds vitae and renders the résumé that the résumé page shows...
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/vitae/go.mod
          cache-dependency-path: tools/*/go.mod

      # ...and builds the résumé PDFs with pdfLaTeX: a minimal TeX Live with only the
      # packages jrresume.cls needs, cached between runs.
      - uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: resume/latex/texlive-packages.txt

      - name: Check that no binary files are tracked
        run: make no-binaries

      - name: Fetch packages and the Jaspr CLI
        run: make setup

      - name: Analyze
        run: make check

      - name: Test the site's Dart code
        run: make site-test

      - name: Build and stage dist/
        run: make dist

      - name: Check the built pages
        run: make verify

      # What an applicant-tracking system reads: pdftotext must extract every passage
      # of each PDF intact and in order. Poppler comes from Ubuntu's archive.
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Check the résumé PDFs' extracted text
        run: make resume-text-check

      - name: Stage the résumé files under their download names
        run: make resume-release

      # Public fields only, as on the site. The private overlay never reaches CI.
      - name: Keep the résumé files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume-${{ github.sha }}
          path: build/resume-release/
          if-no-files-found: error
          retention-days: 30 # tagged releases keep their files for good

      - name: Keep the staged site for deploy
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Deploys to Cloudflare only after both resume checks and site verification pass.
  deploy:
    needs: [resume, site]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the preview URL comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the staged site
        if: steps.cf.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Set up Node for Wrangler
        if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Publish to production
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make deploy

      - name: Upload a preview version
        id: preview
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: |
          make preview ALIAS="pr-${PR_NUMBER}" | tee wrangler.log
          url=$(grep -Eo 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' wrangler.log | head -n 1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment the preview URL
        if: steps.preview.outputs.url != ''
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview of ${HEAD_SHA:0:7}: $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}

  # On a tag such as resume-v2026.11.22, attaches the files the site job built from
  # that commit to a GitHub release, so each version sent out stays downloadable as it
  # was. The tag never deploys: the site publishes only from main.
  release:
    needs: [resume, site]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/resume-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resume-${{ github.sha }}
          path: resume

      - name: Publish the release
        run: |
          {
            echo "Jon Reyna's résumé, built by CI from \`resume/resume.yaml\` at ${GITHUB_SHA:0:7}."
            echo
            echo "Each version comes as PDF, Word, plain text, Markdown and JSON:"
            echo
            for f in resume/Jon-Reyna-Resume.json resume/Jon-Reyna-Resume-*.json; do
              echo "- \`$(basename "$f" .json).*\`: $(jq -r '.description // .variant' "$f")"
            done
          } > notes.md
          gh release create "$TAG" resume/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Résumé ${TAG#resume-v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
