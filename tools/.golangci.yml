# Strict golangci-lint v2 configuration for every Go module under tools/ (from the
# go-best-practices skill). golangci-lint finds it from each module's directory.
#
# Everything is on except the linters below, each disabled for a stated reason. Fix
# findings rather than suppress them; a //nolint must name the linter and say why.
version: "2"

run:
  tests: true

linters:
  default: all
  disable:
    - depguard     # needs a per-project import allow list; nothing to enforce without one
    - errname      # wants xxxError; our rule 10 puts the type first (errorExit)
    - exhaustruct     # demands every field in every literal, fighting useful zero values
    - exhaustruct_v5  # the same linter under its v2.15 name
    - gomodguard   # deprecated since v2.12; gomodguard_v2 (enabled by default: all) replaces it
    - noinlineerr  # forbids `if err := f(); err != nil`, which is idiomatic Go
    - nlreturn     # blank-line style is the formatter's job
    - testpackage  # white-box tests of unexported helpers are valuable; examples use _test packages anyway
    - whitespace   # flags the blank line after a signature that rule 13 requires
    - varnamelen   # flags idiomatic short names (i, r, w, tt)
    - wsl          # deprecated, replaced by wsl_v5
    - wsl_v5       # blank-line style is the formatter's job
  settings:
    cyclop:
      max-complexity: 12
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 80
      statements: 50
    gocritic:
      enabled-tags: [diagnostic, style, performance, experimental, opinionated]
      disabled-checks:
        - unnamedResult # contradicts nonamedreturns; named results are the bigger hazard
    govet:
      enable-all: true
      disable:
        - fieldalignment # orders fields for memory, not for readers
    lll:
      line-length: 120
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: unused-parameter
        - name: unexported-return
        - name: context-as-argument
        - name: early-return
        - name: superfluous-else
        - name: redefines-builtin-id
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
  exclusions:
    generated: strict
    rules:
      # Table-driven tests are long by design, repeat literals across cases on purpose,
      # and their per-case closures inflate complexity counts.
      - path: _test\.go
        linters: [funlen, dupl, lll, goconst, cyclop]
      # Tests read and write files under t.TempDir() and testdata by design.
      - path: _test\.go
        linters: [gosec]
        text: "G304|G703"

formatters:
  # gofmt, not gofumpt: gofumpt deletes the blank line after a signature (rule 13).
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/jonreyna/jonreyna.dev]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
