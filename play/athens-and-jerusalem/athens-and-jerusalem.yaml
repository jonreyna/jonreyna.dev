    checked: null
  - id: L54
    thread: priority
    from: torah
    to: augustine
    type: adapts
    cite: Augustine, De doctrina christiana II.40.60
    quote: >-
      If those who are called philosophers, and especially the Platonists, have said
      anything that is true and in harmony with our faith, we are not only not to shrink
      from it, but to claim it for our own use from those who have unlawful possession of
      it.
    source: npnf1
    url: https://www.newadvent.org/fathers/12022.htm
    compare:
      cite: Exodus 12:35–36 (and 3:22)
      url: https://ebible.org/eng-web/EXO12.htm
    note: >-
      He draws the image from the gold the Israelites took from Egypt. Origen had used it
      in his *Letter to Gregory* 2: "by spoiling the Egyptians, they might have material for
      the preparation of the things which pertained to the service of God."
    located: passage
    checked: null
  - id: L55
    thread: priority
    from: plato
    to: augustine
    type: names
    cite: Augustine, City of God VIII.11; De doctrina christiana II.28.43
    quote: >-
      A careful calculation of dates, contained in chronological history, shows that Plato
      was born about a hundred years after the time in which Jeremiah prophesied.
    source: npnf1
    url: https://www.newadvent.org/fathers/120108.htm
    note: >-
      In *De doctrina christiana* II.28.43 he had credited Ambrose with showing that Plato
      was in Egypt when Jeremiah was there. In *City of God* VIII.11 he says that opinion is
      one "which I myself have expressed in certain of my writings," rejects it on the
      dates, and still allows that Plato may have studied the Scriptures "through an
      interpreter." In *Retractationes* II.4 he corrects the *De doctrina* passage itself,
      saying his memory had betrayed him about Ambrose.
    located: passage
    checked: null
