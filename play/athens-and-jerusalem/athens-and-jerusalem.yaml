  # ================= Who taught whom =================
  - id: L45
    thread: priority
    from: torah
    to: philo
    type: names
    cite: Philo, Quis rerum divinarum heres sit 214; Legum allegoriae I.108; De specialibus legibus IV.61
    quote: >-
      Is not this the thing which the Greeks say that Heraclitus, that great philosopher
      who is so celebrated among them, put forth as the leading principle of his whole
      philosophy … For it is in reality an ancient discovery of Moses.
    source: yonge
    url: https://www.earlyjewishwritings.com/text/philo/book17.html
    note: >-
      *Legum allegoriae* I.108: "Heraclitus … following the doctrine of Moses." *De
      specialibus legibus* IV.61: "some of the lawgivers among the Greeks, having
      transcribed some of the laws from the two tables of Moses."
    located: passage
    checked: null
  - id: L46
    thread: priority
    from: torah
    to: justin
    type: names
    cite: Justin, 1 Apology 44, 59–60
    quote: >-
      It was from our teachers — we mean the account given through the prophets — that
      Plato borrowed his statement that God, having altered matter which was shapeless,
      made the world.
    source: anf
    url: https://www.newadvent.org/fathers/0126.htm
    note: >-
      Chapter 60 says the same of the cross shape in the *Timaeus*. Chapter 44: the
      philosophers and poets "have received such suggestions from the prophets," "and
      hence there seem to be seeds of truth among all men."
    located: passage
    checked: null
  - id: L47
