    url: https://www.tertullian.org/fathers/eusebius_pe_11_book11.htm
    note: >-
      Eusebius gives it as a saying "currently attributed" to Numenius (*Praep. ev.*
      XI.10.14, fr. 8 des Places). Origen (*Against Celsus* IV.51) says Numenius "in many
